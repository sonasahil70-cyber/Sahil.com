<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ For Rupali Ji ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

font-family:'Poppins',sans-serif;

background:linear-gradient(-45deg,#ff0066,#ff4d88,#7b2ff7,#0099ff);

background-size:400% 400%;

animation:bg 12s ease infinite;

}


@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}



#loader{

position:fixed;

inset:0;

background:#000;

color:white;

display:flex;

justify-content:center;

align-items:center;

z-index:9999;

}



#loader h1{

font-family:'Great Vibes',cursive;

font-size:45px;

}



.card{

width:90%;

max-width:700px;

padding:35px;

text-align:center;

color:white;

background:rgba(255,255,255,.15);

backdrop-filter:blur(20px);

border-radius:30px;

box-shadow:0 0 40px rgba(255,255,255,.3);

}



.profile{

width:170px;

height:170px;

border-radius:50%;

object-fit:cover;

border:5px solid white;

box-shadow:0 0 30px #ff4d88;

margin-bottom:20px;

}



h1{

font-family:'Great Vibes',cursive;

font-size:60px;

}



#timer{

margin:15px;

font-size:18px;

}



#message{

min-height:220px;

white-space:pre-wrap;

line-height:1.8;

font-size:18px;

}



button{

margin-top:25px;

padding:15px 40px;

border:none;

border-radius:50px;

background:white;

color:#ff0066;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



button:hover{

transform:scale(1.1);

}



.heart{

position:absolute;

color:white;

animation:float 6s linear infinite;

}



@keyframes float{

from{

transform:translateY(100vh);

opacity:1;

}


to{

transform:translateY(-10vh);

opacity:0;

}

}



@media(max-width:600px){

.profile{

width:130px;

height:130px;

}


h1{

font-size:45px;

}

}

</style>

</head>


<body>


<div id="loader">

<h1>❤️ Loading Love... ❤️</h1>

</div>



<div class="card">


<img src="photo.jpg.jpg" class="">


<h1>❤️ Rupali Ji ❤️</h1>


<p id="timer">

Forever Together ❤️

</p>



<div id="message"></div>



<button onclick="love()">

Click My Heart ❤️

</button>


</div>



<audio id="music" loop>

<source src="love.mp3" type="audio/mpeg">

</audio>



<script>


window.onload=function(){

setTimeout(()=>{

document.getElementById("loader").style.display="none";

},2000);

};



const text=`❤️ Meri Pyari Rupali ❤️

Jab se tum meri zindagi mein aayi ho,
meri duniya aur bhi khoobsurat ho gayi hai.

Tumhari smile meri khushi hai.

Main hamesha tumhara saath dunga.

I Love You Forever ❤️`;

let i=0;



function typeWriter(){

if(i<text.length){

document.getElementById("message").innerHTML += text.charAt(i);

i++;

setTimeout(typeWriter,40);

}

}



function love(){

document.getElementById("music").play();

document.getElementById("message").innerHTML="";

i=0;

typeWriter();


for(let x=0;x<30;x++){

let h=document.createElement("div");

h.innerHTML="❤️";

h.style.position="fixed";

h.style.left="50%";

h.style.top="50%";

h.style.fontSize="25px";


document.body.appendChild(h);


h.animate([

{transform:"translate(0,0)",opacity:1},

{transform:`translate(${Math.random()*600-300}px,${Math.random()*600-300}px)`,opacity:0}

],{

duration:1500

});


setTimeout(()=>h.remove(),1500);

}

}



for(let x=0;x<80;x++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*25)+"px";

h.style.animationDuration=(3+Math.random()*5)+"s";

document.body.appendChild(h);

}



setInterval(()=>{

let now=new Date();

let start=new Date("2025-03-14");

let days=Math.floor((now-start)/(1000*60*60*24));

document.getElementById("timer").innerHTML=

"❤️ Together for "+days+" Days ❤️";


},1000);


</script>


</body>

</html>
